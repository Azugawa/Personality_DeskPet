[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="assets/**/*.json,config/*.json,config/**/*.json,assets/fonts/*.txt,assets/fonts/LICENSES/**/*.txt,bin/*.exe,bin/*.ps1"
exclude_filter="assets/physics/*,tests/*,tools/*,docs/*,packaging/*"
export_path="../build/windows/DeskPet.exe"
[preset.0.options]
custom_template/debug="../build/tooling/templates/windows_debug_x86_64.exe"
custom_template/release="../build/tooling/templates/windows_release_x86_64.exe"
binary_format/architecture="x86_64"
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
codesign/enable=false
application/product_name="何爪爪"
application/file_description="何爪爪"
application/file_version="0.3.0.0"
application/product_version="0.3.0.0"

application/icon="res://assets/ui/icons/app.ico"
